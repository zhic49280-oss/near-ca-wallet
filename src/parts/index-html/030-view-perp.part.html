      <!-- ==================== Tab 3: Perpetuals / Hyperliquid (#view-perp) ==================== -->
      <section id="view-perp" class="view-section hidden">
        <!-- 1. Contract Wallet Summary (Always visible in Overview) -->
        <div id="perp-overview-panel" class="flex flex-col gap-3">
          <div class="ios-glass-card flex flex-col gap-2">
            <div class="perp-summary-grid">
              <div class="perp-stat-box">
                <span class="kpi-label" data-i18n="perp.equityLabel">合约净值</span>
                <span id="perp-equity-val" class="kpi-value">--</span>
              </div>
              <div class="perp-stat-box">
                <span class="kpi-label" data-i18n="perp.availMarginLabel">可用保证金</span>
                <span id="perp-avail-val" class="kpi-value text-emerald">--</span>
              </div>
              <div class="perp-stat-box">
                <span class="kpi-label" data-i18n="perp.upnlLabel">未实现盈亏</span>
                <span id="perp-upnl-val" class="kpi-value">--</span>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <button type="button" class="mini-action-btn primary flex-1" onclick="openPerpFundingSheet('deposit')" data-i18n="perp.depositBtn">充值</button>
              <button type="button" class="mini-action-btn flex-1" onclick="openPerpFundingSheet('withdraw')" data-i18n="perp.withdrawBtn">提现</button>
              <button type="button" id="btn-perp-overview-refresh" class="btn-ghost-sm" onclick="refreshPerpDataAsync(true)" data-i18n="common.refresh">刷新</button>
            </div>

            <div id="perp-spot-banner" class="perp-spot-banner hidden">
              <span style="font-size: 11.5px; color: var(--text-primary);">
                <span data-i18n="perp.spotPendingPrefix">跨链资金已到账</span>
                <strong id="perp-spot-pending-amt" class="mono text-emerald">--</strong>
              </span>
              <button type="button" class="mini-action-btn primary" onclick="quickTransferSpotToPerpUI()" data-i18n="perp.transferToPerpBtn">一键转入合约 (免费)</button>
            </div>

            <div id="perp-overview-positions-wrap" class="hidden flex flex-col gap-2" style="padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.06);"></div>
          </div>

          <!-- Market Overview List: Watchlist / Crypto / Stocks (HIP-3) / All -->
          <div class="ios-glass-card flex flex-col gap-2">
            <div class="search-input-wrap">
              <input id="perp-overview-search" type="text" class="input-field" data-i18n-placeholder="perp.overviewSearchPlaceholder" placeholder="搜索合约 (如 BTC, PEPE, CRCL, NVDA...)" oninput="handlePerpOverviewSearch(this.value)" />
              <button type="button" id="perp-overview-search-clear" class="search-clear-btn hidden" onclick="clearPerpOverviewSearch()" aria-label="Clear">✕</button>
            </div>

            <div id="perp-overview-cats" class="pill-scroll">
              <button type="button" class="filter-pill" data-action="set-perp-overview-cat" data-cat="favorites" data-i18n="perp.catFavorites">⭐ 自选</button>
              <button type="button" class="filter-pill active" data-action="set-perp-overview-cat" data-cat="crypto" data-i18n="perp.catCrypto">🪙 加密货币</button>
              <button type="button" class="filter-pill" data-action="set-perp-overview-cat" data-cat="stocks" data-i18n="perp.catStocks">📈 股票</button>
              <button type="button" class="filter-pill" data-action="set-perp-overview-cat" data-cat="all" data-i18n="perp.catAll">全部</button>
            </div>

            <div class="perp-mkt-col-hdr">
              <button type="button" class="perp-sort-hdr-btn" data-action="sort-perp-overview" data-sort="vol">
                <span data-i18n="perp.colContractVol">合约 / 成交额</span> <span id="perp-sort-ind-vol">↓</span>
              </button>
              <div class="flex items-center gap-3">
                <button type="button" class="perp-sort-hdr-btn" data-action="sort-perp-overview" data-sort="px">
                  <span data-i18n="perp.colLastPx">最新价</span> <span id="perp-sort-ind-px">⇅</span>
                </button>
                <button type="button" class="perp-sort-hdr-btn" data-action="sort-perp-overview" data-sort="chg" style="min-width: 70px; justify-content: flex-end;">
                  <span data-i18n="perp.colChg24h">24h 涨跌</span> <span id="perp-sort-ind-chg">⇅</span>
                </button>
              </div>
            </div>

            <div id="perp-overview-list" class="flex flex-col gap-2"></div>
          </div>
        </div>

        <!-- 2. OKX-Style Trade View (Hidden until market clicked) -->
        <div id="perp-trade-panel" class="flex flex-col gap-2 hidden">
          <div class="ios-glass-card flex flex-col gap-2" style="padding: 12px;">
            <div class="perp-trade-top-bar">
              <div class="perp-trade-top-left">
                <button type="button" id="btn-perp-back" class="btn-ghost-sm perp-back-btn" onclick="backToPerpOverview()" data-i18n="perp.backToMarkets">← 行情</button>
                <button type="button" id="perp-coin-btn" class="token-select-btn" onclick="openPerpMarketsSheet()">
                  <span id="perp-coin-icon" class="perp-coin-icon-slot"></span>
                  <span id="perp-coin-name" class="perp-coin-name-text">BTC-USDC</span>
                  <span style="flex-shrink: 0;">▾</span>
                </button>
              </div>
              <div class="perp-trade-top-right">
                <div class="flex flex-col" style="text-align: right;">
                  <span id="perp-mark-px" class="mono" style="font-size: 14.5px; font-weight: 800; color: #ffffff;">--</span>
                  <span id="perp-change-24h" class="mono" style="font-size: 10px; color: var(--text-secondary);">--</span>
                </div>
                <button type="button" id="btn-perp-fav-current" class="btn-ghost-sm" onclick="toggleCurrentPerpFavorite()" style="padding: 4px 7px;">☆</button>
                <button type="button" id="btn-perp-trade-refresh" class="btn-ghost-sm" onclick="refreshPerpDataAsync(true)" data-i18n="common.refresh" style="padding: 4px 7px;">刷新</button>
                <button type="button" id="btn-perp-chart-toggle" class="btn-ghost-sm" onclick="togglePerpChart()" data-i18n="perp.chartBtn" style="padding: 4px 8px;">K线</button>
              </div>
            </div>

            <div id="perp-market-stats" class="perp-market-stats">
              <div class="perp-mstat">
                <span class="meta-key" data-i18n="perp.vol24hLabel">24h 成交额</span>
                <span id="perp-vol-24h" class="mono" style="font-size: 11px; font-weight: 700;">--</span>
              </div>
              <div class="perp-mstat">
                <span class="meta-key" data-i18n="perp.oiLabel">全网持仓 (OI)</span>
                <span id="perp-oi-val" class="mono" style="font-size: 11px; font-weight: 700;">--</span>
              </div>
              <div class="perp-mstat" style="text-align: right;">
                <span class="meta-key" data-i18n="perp.fundingRateLabel">资金费率(1h)</span>
                <span id="perp-funding-rate" class="mono" style="font-size: 11px; font-weight: 700;">--</span>
              </div>
            </div>

            <div id="perp-chart-wrap" class="perp-chart-wrap">
              <div class="flex items-center justify-between gap-2" style="margin-bottom: 6px;">
                <div id="perp-interval-pills" class="flex gap-1">
                  <button type="button" class="filter-pill" data-iv="5m" onclick="setPerpChartInterval('5m')">5m</button>
                  <button type="button" class="filter-pill active" data-iv="15m" onclick="setPerpChartInterval('15m')">15m</button>
                  <button type="button" class="filter-pill" data-iv="1h" onclick="setPerpChartInterval('1h')">1h</button>
                  <button type="button" class="filter-pill" data-iv="4h" onclick="setPerpChartInterval('4h')">4h</button>
                  <button type="button" class="filter-pill" data-iv="1d" onclick="setPerpChartInterval('1d')">1d</button>
                </div>
                <span id="perp-chart-hl" class="mono" style="font-size: 10.5px; color: var(--text-muted);">--</span>
              </div>
              <div id="perp-candle-detail" class="perp-candle-inspect-bar mono"></div>
              <div id="perp-chart-svg"></div>
            </div>
          </div>

          <!-- OKX Split: Left Order Ticket + Right Compact Orderbook -->
          <div class="perp-okx-split-grid">
            <!-- Left: Order Ticket -->
            <div class="ios-glass-card flex flex-col gap-2" style="padding: 11px;">
              <div class="perp-side-switch">
                <button type="button" id="perp-side-long" class="perp-side-btn long active" onclick="setPerpSide('long')" data-i18n="perp.longBtn">做多</button>
                <button type="button" id="perp-side-short" class="perp-side-btn short" onclick="setPerpSide('short')" data-i18n="perp.shortBtn">做空</button>
              </div>

              <div class="flex items-center justify-between gap-1">
                <div class="mode-pill-switch">
                  <button type="button" id="perp-mode-isolated" class="mode-pill-btn active" onclick="setPerpMarginMode('isolated')" data-i18n="perp.isolatedBtn">逐仓</button>
                  <button type="button" id="perp-mode-cross" class="mode-pill-btn" onclick="setPerpMarginMode('cross')" data-i18n="perp.crossBtn">全仓</button>
                </div>
                <span id="perp-lev-val" class="mono text-emerald" style="font-size: 12px; font-weight: 800;">5x</span>
              </div>

              <input id="perp-leverage-slider" type="range" min="1" max="50" step="1" value="5" class="perp-slider" oninput="setPerpLeverage(this.value)" />

              <div class="mode-pill-switch" style="width: 100%; justify-content: space-between;">
                <button type="button" id="perp-type-market" class="mode-pill-btn active flex-1" onclick="setPerpOrderType('market')" data-i18n="perp.marketBtn">市价</button>
                <button type="button" id="perp-type-limit" class="mode-pill-btn flex-1" onclick="setPerpOrderType('limit')" data-i18n="perp.limitBtn">限价</button>
                <button type="button" id="perp-type-post-only" class="mode-pill-btn flex-1" onclick="setPerpOrderType('post_only')" data-i18n="perp.postOnlyBtn">只做Maker</button>
              </div>

              <div id="perp-limit-price-row" class="swap-box hidden" style="padding: 8px;">
                <div class="swap-box-top">
                  <span data-i18n="perp.limitPriceLabel" style="font-size: 11px;">委托价格</span>
                  <button type="button" class="mini-action-btn primary" onclick="fillPerpBboPrice()" data-i18n="perp.bboBtn" style="padding: 2px 6px; font-size: 10.5px;">最优价</button>
                </div>
                <input id="perp-limit-price-input" type="number" step="any" min="0" class="amount-input-lg" style="font-size: 15px;" placeholder="0.00" oninput="handlePerpLimitPriceInput()" />
              </div>

              <div class="swap-box" style="padding: 8px;">
                <div class="swap-box-top">
                  <span data-i18n="perp.marginInputLabel" style="font-size: 11px;">保证金 (USDC)</span>
                  <span style="font-size: 10.5px;"><span data-i18n="swap.balanceLabel">可用</span>: <span id="perp-ticket-avail" class="mono">--</span></span>
                </div>
                <div class="swap-box-main">
                  <input id="perp-margin-input" type="number" step="any" min="0" class="amount-input-lg" style="font-size: 16px;" placeholder="0.00" oninput="handlePerpMarginInput()" />
                </div>
                <div class="perp-pct-row" style="gap: 4px;">
                  <button type="button" class="mini-action-btn" onclick="setPerpMarginPercent(0.25)">25%</button>
                  <button type="button" class="mini-action-btn" onclick="setPerpMarginPercent(0.50)">50%</button>
                  <button type="button" class="mini-action-btn" onclick="setPerpMarginPercent(0.75)">75%</button>
                  <button type="button" class="mini-action-btn primary" onclick="setPerpMarginPercent(0.99)">MAX</button>
                </div>
              </div>

              <div class="flex items-center justify-between gap-2" style="font-size: 11px; color: var(--text-secondary);">
                <label class="flex items-center gap-1" style="cursor: pointer;">
                  <input id="perp-reduce-only-chk" type="checkbox" onchange="togglePerpReduceOnly(this.checked)" />
                  <span data-i18n="perp.reduceOnlyLabel">只减仓</span>
                </label>
                <button type="button" id="btn-perp-tpsl-toggle" class="perp-tpsl-toggle-btn" style="width: auto; padding: 3px 8px; font-size: 11px;" data-action="toggle-perp-tpsl" aria-expanded="false">
                  <span data-i18n="perp.tpslLabel">止盈/止损</span> ▾
                </button>
              </div>
              <div id="perp-tpsl-drawer" class="flex gap-1 hidden">
                <input id="perp-tp-input" type="number" step="any" min="0" class="input-field mono flex-1" style="font-size: 11.5px; padding: 6px 8px;" data-i18n-placeholder="perp.tpPlaceholder" placeholder="止盈触发价" oninput="evaluatePerpOrderUI()" />
                <input id="perp-sl-input" type="number" step="any" min="0" class="input-field mono flex-1" style="font-size: 11.5px; padding: 6px 8px;" data-i18n-placeholder="perp.slPlaceholder" placeholder="止损触发价" oninput="evaluatePerpOrderUI()" />
              </div>

              <div class="meta-list perp-meta-grid">
                <div class="meta-row perp-meta-cell">
                  <span class="meta-key" data-i18n="perp.notionalLabel">名义价值</span>
                  <span id="perp-meta-notional" class="meta-val">--</span>
                </div>
                <div class="meta-row perp-meta-cell">
                  <span class="meta-key" data-i18n="perp.sizeLabel">委托数量</span>
                  <span id="perp-meta-size" class="meta-val">--</span>
                </div>
                <div class="meta-row perp-meta-cell">
                  <span class="meta-key" data-i18n="perp.liqEstLabel">预估强平价</span>
                  <span id="perp-meta-liq" class="meta-val">--</span>
                </div>
                <div class="meta-row perp-meta-cell">
                  <span class="meta-key" data-i18n="perp.estFeeLabel">预估手续费</span>
                  <span id="perp-meta-fee" class="meta-val">--</span>
                </div>
              </div>

              <div id="perp-error-banner" class="swap-error-banner hidden"></div>
              <button type="button" id="btn-perp-submit" class="btn-primary" onclick="executePerpOrderUI()" data-i18n="perp.submitLongBtn">开多</button>
            </div>

            <!-- Right: Compact Live Orderbook -->
            <div class="ios-glass-card flex flex-col gap-2" style="padding: 10px;">
              <div id="perp-ls-ratio-wrap" class="perp-ob-power-wrap" style="min-height: 22px; opacity: 0.55;">
                <div class="flex items-center justify-between" style="font-size: 9.5px;">
                  <span id="perp-ls-long-label" class="mono text-emerald">--</span>
                  <span id="perp-ls-short-label" class="mono text-rose">--</span>
                </div>
                <div class="perp-ob-power-track">
                  <div id="perp-ls-long-bar" class="perp-ob-power-bid" style="width: 50%;"></div>
                  <div id="perp-ls-short-bar" class="perp-ob-power-ask" style="width: 50%;"></div>
                </div>
              </div>

              <div id="perp-ob-power-wrap" class="perp-ob-power-wrap">
                <div class="flex items-center justify-between" style="font-size: 9.5px;">
                  <span id="perp-ob-bid-summary" class="mono text-emerald">--</span>
                  <span id="perp-ob-ask-summary" class="mono text-rose">--</span>
                </div>
                <div class="perp-ob-power-track">
                  <div id="perp-ob-bid-bar" class="perp-ob-power-bid" style="width: 50%;"></div>
                  <div id="perp-ob-ask-bar" class="perp-ob-power-ask" style="width: 50%;"></div>
                </div>
              </div>

              <div id="perp-ob-header" class="perp-ob-header" style="grid-template-columns: 1fr;">
                <div class="perp-ob-hcol">
                  <span id="perp-ob-bid-sz-hdr">数量</span>
                  <span id="perp-ob-ask-sz-hdr" style="display:none;">数量</span>
                  <span data-i18n="perp.obBidPx">价格 (USDC)</span>
                </div>
              </div>

              <div class="perp-ob-grid perp-ob-stacked" id="perp-orderbook-box">
                <div class="perp-ob-col" id="perp-ob-asks"></div>
                <div id="perp-ob-mid-badge" class="perp-ob-mid-badge mono">--</div>
                <div class="perp-ob-col" id="perp-ob-bids"></div>
              </div>
            </div>
          </div>

          <!-- 3. Bottom Positions / Open Orders / Fills & Assets -->
          <div class="ios-glass-card flex flex-col gap-2">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-1 flex-wrap">
                <button type="button" id="perp-tab-positions" class="filter-pill active" onclick="setPerpBottomTab('positions')" data-i18n="perp.tabPositions">当前持仓</button>
                <button type="button" id="perp-tab-orders" class="filter-pill" onclick="setPerpBottomTab('orders')" data-i18n="perp.tabOrders">当前委托</button>
                <button type="button" id="perp-tab-fills" class="filter-pill" onclick="setPerpBottomTab('fills')" data-i18n="perp.tabFills">历史成交</button>
              </div>
              <button type="button" id="btn-perp-batch-action" class="btn-ghost-sm hidden" onclick="executePerpBatchAction()">--</button>
            </div>
            <div id="perp-bottom-list" class="flex flex-col gap-2"></div>
          </div>
        </div>
      </section>
