      <!-- ==================== Onboarding View ==================== -->
      <section id="view-onboarding" class="view-section hidden">
        <div class="ios-glass-card hero-card" style="padding: 24px 18px; text-align: center;">
          <img src="assets/nexus-logo-512.png?v=6.61" alt="Nexus Wallet" style="width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; border: 1px solid rgba(0,236,151,0.35); display: block; object-fit: cover; box-shadow: 0 8px 24px rgba(0,236,151,0.16);" />
          <span class="ca-badge" data-i18n="onboard.badge">NEAR 链抽象自托管账户</span>
          <h1 style="margin: 12px 0 8px; font-size: 21px; font-weight: 800; color: #fff;" data-i18n="onboard.title">一个 NEAR 账户，畅通全链资产</h1>
          <p style="margin: 0 0 20px; font-size: 12.5px; color: var(--text-secondary);" data-i18n="onboard.subtitle">一站式多链自托管资产管理、跨链闪兑与链上理财</p>

          <div id="onboard-choice-panel" class="flex flex-col gap-2">
            <button type="button" class="btn-primary" onclick="openCreateWalletFlow()" data-i18n="onboard.createBtn">创建 NEAR 链抽象钱包</button>
            <button type="button" class="btn-secondary" onclick="openImportWalletFlow()" data-i18n="onboard.importBtn">导入 12 / 24 词助记词</button>
          </div>

          <div id="onboard-create-panel" class="hidden flex flex-col gap-3" style="text-align: left; margin-top: 10px;">
            <div class="flex items-center justify-between gap-2">
              <div id="onboard-create-title" style="font-weight: 700; font-size: 14px;" data-i18n="onboard.createTitle">备份您的助记词</div>
            </div>
            <div id="onboard-create-hint" style="font-size: 12px; color: var(--text-secondary);" data-i18n="onboard.createHint">请妥善离线保存以下 12 个单词，它是恢复所有链上资产的唯一凭证</div>
            <div id="onboard-seed-grid" class="seed-grid"></div>
            <button type="button" class="btn-ghost-sm" style="align-self: flex-start;" onclick="copyPendingMnemonic()" data-i18n="onboard.copySeedBtn">复制助记词</button>
            <input id="onboard-create-name" type="text" class="input-field" data-i18n-placeholder="onboard.walletNamePlaceholder" placeholder="钱包名称（可选）" />
            <input id="onboard-create-pin" type="password" inputmode="numeric" maxlength="6" class="input-field" data-i18n-placeholder="onboard.pinPlaceholder" placeholder="设置 6 位交易密码（可选）" />
            <div class="flex gap-2">
              <button type="button" class="btn-secondary" onclick="cancelOnboardSubPanel()" data-i18n="onboard.cancelBtn">返回</button>
              <button type="button" class="btn-primary" onclick="confirmCreateWallet()" data-i18n="onboard.confirmCreateBtn">已备份，进入钱包</button>
            </div>
          </div>

          <div id="onboard-import-panel" class="hidden flex flex-col gap-3" style="text-align: left; margin-top: 10px;">
            <div style="font-weight: 700; font-size: 14px;" data-i18n="onboard.importTitle">导入恢复助记词</div>
            <textarea id="onboard-import-phrase" class="input-field mono" data-i18n-placeholder="onboard.importPlaceholder" placeholder="输入 12 或 24 个英文助记词，使用空格分隔" oninput="validateOnboardImportLive()"></textarea>
            <div id="onboard-import-status" style="font-size: 11.5px; color: var(--text-secondary);"></div>
            <input id="onboard-import-name" type="text" class="input-field" data-i18n-placeholder="onboard.walletNamePlaceholder" placeholder="钱包名称（可选）" />
            <div class="flex gap-2">
              <button type="button" class="btn-secondary" onclick="cancelOnboardSubPanel()" data-i18n="onboard.cancelBtn">返回</button>
              <button type="button" class="btn-primary" onclick="confirmImportWallet()" data-i18n="onboard.confirmImportBtn">派生全链账户并导入</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ==================== Tab 1: Assets (#view-wallet) ==================== -->
      <section id="view-wallet" class="view-section hidden">
        <div id="home-ptr-indicator" class="home-ptr-indicator" aria-live="polite">
          <span class="ptr-spinner"></span>
          <span id="home-ptr-text" data-i18n="home.ptrPull">下拉刷新链上余额</span>
        </div>
        <div class="ios-glass-card hero-card">
          <div class="hero-top-row">
            <span class="hero-caption" data-i18n="home.totalBalance">统一资产总览 (USD)</span>
            <button type="button" id="btn-home-refresh" class="btn-ghost-sm" onclick="refreshAllBalancesAsync(true)" data-i18n="common.refresh" style="padding: 3px 9px; font-size: 11px;">刷新</button>
          </div>
          <div id="hero-total-usd" class="hero-balance">--</div>

          <div class="hero-id-row">
            <div class="hero-id-meta">
              <span class="hero-id-label" data-i18n="home.masterAccount">NEAR 主账户</span>
              <span id="hero-near-id" class="hero-id-value">--</span>
            </div>
            <div class="hero-id-btns">
              <button type="button" class="mini-action-btn" onclick="copyActiveNearId()" data-i18n="common.copy">复制</button>
              <button type="button" id="btn-hero-register-near" class="mini-action-btn primary" onclick="jumpToNearDomainManager()" data-i18n="home.registerNear">注册 .near</button>
            </div>
          </div>

          <div class="hero-actions-grid">
            <button type="button" class="quick-action-btn" onclick="openSendSheet()">
              <span class="quick-action-icon">↑</span>
              <span data-i18n="home.send">转账</span>
            </button>
            <button type="button" class="quick-action-btn" onclick="openReceiveSheet()">
              <span class="quick-action-icon">↓</span>
              <span data-i18n="home.receive">收款</span>
            </button>
            <button type="button" class="quick-action-btn" onclick="switchTab('swap')">
              <span class="quick-action-icon">⇄</span>
              <span data-i18n="home.swap">闪兑</span>
            </button>
            <button type="button" class="quick-action-btn" onclick="switchTab('earn')">
              <span class="quick-action-icon">◈</span>
              <span data-i18n="home.earn">质押</span>
            </button>
          </div>
        </div>

        <div class="section-header-row">
          <h2 class="section-title" data-i18n="home.assetsTitle">聚合资产列表</h2>
        </div>

        <div id="home-unified-asset-list" class="asset-list"></div>
      </section>
