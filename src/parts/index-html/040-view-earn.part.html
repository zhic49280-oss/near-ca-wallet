      <!-- ==================== Earn / Liquid Staking (#view-earn, entered from Home) ==================== -->
      <section id="view-earn" class="view-section hidden">
        <div class="section-header-row">
          <div class="flex items-center gap-2">
            <button type="button" class="btn-ghost-sm" onclick="switchTab('wallet')" data-i18n="common.back">← 返回</button>
            <h2 class="section-title" data-i18n="earn.title">链上流动性质押</h2>
          </div>
          <button type="button" class="btn-ghost-sm" onclick="refreshStakingMetrics(true)" data-i18n="earn.refreshBtn">刷新利率</button>
        </div>

        <input id="earn-pool-search" type="text" class="input-field" data-i18n-placeholder="earnSearchPlaceholder" placeholder="搜索质押代币、协议或合约 (如 RHEA, JUP, NEAR, SOL, USDC)..." oninput="handleEarnPoolSearch(this.value)" />

        <div id="earn-pool-filters" class="pill-scroll">
          <button type="button" class="filter-pill active" data-filter="featured" onclick="setEarnPoolFilter('featured')" data-i18n="earn.filterFeatured">🔥 热门大池</button>
          <button type="button" class="filter-pill" data-filter="all" onclick="setEarnPoolFilter('all')" data-i18n="earn.filterAll">全部质押池 (21)</button>
          <button type="button" class="filter-pill" data-filter="lending" onclick="setEarnPoolFilter('lending')" data-i18n="earn.filterLending">🏦 借贷与生息</button>
          <button type="button" class="filter-pill" data-filter="near" onclick="setEarnPoolFilter('near')" data-i18n="earn.filterNear">NEAR &amp; Rhea</button>
          <button type="button" class="filter-pill" data-filter="sol" onclick="setEarnPoolFilter('sol')" data-i18n="earn.filterSol">Solana &amp; JUP</button>
          <button type="button" class="filter-pill" data-filter="evm" onclick="setEarnPoolFilter('evm')" data-i18n="earn.filterEvm">EVM &amp; Arc</button>
        </div>

        <div id="earn-my-positions-card" class="ios-glass-card hidden flex flex-col gap-2" style="margin-bottom: 10px;">
          <div class="flex items-center justify-between">
            <span style="font-weight: 700; font-size: 13.5px;" data-i18n="earn.myPositionsTitle">我的质押仓位</span>
            <span id="earn-my-positions-count" class="ca-badge">0</span>
          </div>
          <div id="earn-my-positions-list" class="flex flex-col gap-2"></div>
        </div>

        <div id="staking-pools-list" class="staking-pools-grid" style="max-height: 44vh; overflow-y: auto;"></div>

        <div class="ios-glass-card flex flex-col gap-3">
          <div class="flex items-center justify-between">
            <span id="earn-selected-title" style="font-weight: 700; font-size: 14px;">--</span>
            <span style="font-size: 12px; color: var(--text-secondary);">
              <span data-i18n="swap.balanceLabel">可用</span>: <span id="earn-avail-balance" class="mono">--</span>
            </span>
          </div>

          <div class="swap-box">
            <div class="swap-box-top">
              <span data-i18n="earn.amountLabel">质押数量</span>
              <button type="button" class="mini-action-btn primary" onclick="setEarnMaxAmount()" data-i18n="swap.maxBtn">全部</button>
            </div>
            <div class="swap-box-main">
              <span id="earn-in-symbol" style="font-weight: 700; font-size: 15px;">NEAR</span>
              <input id="earn-amount-in" type="number" step="any" min="0" class="amount-input-lg" placeholder="0.00" oninput="updateEarnEstimatedOut()" />
            </div>
          </div>

          <div id="earn-lock-row" class="hidden flex flex-col gap-2">
            <span class="meta-key" style="font-size: 12px;" data-i18n="earn.lockLabel">锁仓周期</span>
            <div id="earn-lock-tiers" class="pill-scroll"></div>
          </div>

          <div class="meta-list">
            <div class="meta-row">
              <span class="meta-key" data-i18n="earn.apyLabel">实时年化</span>
              <span id="earn-live-apy" class="meta-val text-emerald">--</span>
            </div>
            <div class="meta-row">
              <span class="meta-key" data-i18n="earn.tvlLabel">总质押量 (TVL)</span>
              <span id="earn-tvl-val" class="meta-val">--</span>
            </div>
            <div class="meta-row">
              <span class="meta-key" data-i18n="earn.stakersLabel">质押人数</span>
              <span id="earn-stakers-val" class="meta-val">--</span>
            </div>
            <div class="meta-row">
              <span class="meta-key" data-i18n="earn.rateLabel">兑换比例</span>
              <span id="earn-live-rate" class="meta-val">--</span>
            </div>
            <div class="meta-row">
              <span class="meta-key" data-i18n="earn.estReceive">预计获得</span>
              <span id="earn-est-out" class="meta-val">--</span>
            </div>
          </div>

          <button type="button" id="btn-execute-stake" class="btn-primary" onclick="executeSelectedStake()" data-i18n="earn.stakeBtn">确认链上质押</button>

          <div id="earn-tx-receipt" class="hidden meta-list" style="border-color: rgba(0,236,151,0.3);"></div>
        </div>
      </section>
