      <!-- ==================== Tab 2: Swap & Limit Orders (#view-swap) ==================== -->
      <section id="view-swap" class="view-section hidden">
        <div class="section-header" style="margin-bottom: 4px;">
          <div id="swap-mode-toggle" class="mode-pill-switch" role="tablist">

            <button type="button" id="swap-mode-limit-btn" class="mode-pill-btn" onclick="setSwapPanelMode('limit')" data-i18n="swap.modeLimit">限价</button>
          </div>
          <span class="ca-badge" data-i18n="header.caBadge">NEAR CA</span>
        </div>

        <div id="swap-market-panel" class="flex flex-col gap-3">
        <!-- Swap Main Card -->
        <div class="ios-glass-card flex flex-col gap-3">
          <!-- From Box -->
          <div class="swap-box">
            <div class="swap-box-top">
              <span data-i18n="swap.fromLabel">支付</span>
              <div class="flex items-center gap-2">
                <span><span data-i18n="swap.balanceLabel">可用</span>: <span id="swap-from-balance" class="mono">--</span></span>
                <button type="button" class="mini-action-btn primary" onclick="setSwapMaxAmount()" data-i18n="swap.maxBtn">全部</button>
              </div>
            </div>
            <div class="swap-box-main">
              <button type="button" id="swap-from-token-btn" class="token-select-btn" onclick="openTokenPicker('from')"></button>
              <input id="swap-amount-in" type="number" step="any" min="0" class="amount-input-lg" placeholder="0.00" oninput="handleSwapAmountInput()" />
            </div>
            <div class="swap-box-top">
              <span id="swap-from-net-label">--</span>
              <span id="swap-usd-in">--</span>
            </div>
          </div>

          <!-- Flip Button -->
          <div class="swap-flip-wrap">
            <button type="button" class="swap-flip-btn" onclick="flipSwapTokens()" aria-label="Flip">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
            </button>
          </div>

          <!-- To Box -->
          <div class="swap-box">
            <div class="swap-box-top">
              <span data-i18n="swap.toLabel">获得</span>
              <span><span data-i18n="swap.balanceLabel">可用</span>: <span id="swap-to-balance" class="mono">--</span></span>
            </div>
            <div class="swap-box-main">
              <button type="button" id="swap-to-token-btn" class="token-select-btn" onclick="openTokenPicker('to')"></button>
              <input id="swap-amount-out" type="text" readonly class="amount-input-lg" placeholder="--" />
            </div>
            <div class="swap-box-top">
              <span id="swap-to-net-label">--</span>
              <span id="swap-usd-out">--</span>
            </div>
          </div>

          <!-- Auto Route & Recipient -->
          <div class="meta-row" style="font-size: 12px;">
            <span class="meta-key" data-i18n="swap.autoRouteLabel">智能路由</span>
            <span id="swap-auto-route-badge" class="ca-badge">--</span>
          </div>
          <div class="flex flex-col gap-1">
            <div class="flex items-center justify-between">
              <span style="font-size: 11.5px; color: var(--text-secondary);" data-i18n="swap.recipientLabel">目标链收款地址</span>
              <button type="button" id="swap-recipient-contacts-btn" class="btn-ghost-sm" onclick="openContactsPicker('swap')" data-i18n="common.contacts">地址簿</button>
            </div>
            <input id="swap-recipient-input" type="text" class="input-field mono" data-i18n-placeholder="swap.recipientPlaceholder" placeholder="自动匹配当前主账户对应链地址" oninput="handleSwapRecipientInput()" />
          </div>

          <!-- Quote Meta -->
          <div id="swap-quote-meta" class="meta-list">
            <div class="meta-row">
              <span class="meta-key" data-i18n="swap.rateLabel">参考汇率</span>
              <span id="swap-quote-rate" class="meta-val" role="button" tabindex="0" style="cursor: pointer;" onclick="toggleSwapRateOrientation()">--</span>
            </div>
            <button type="button" id="swap-details-toggle" class="meta-toggle-btn" onclick="toggleSwapDetails()" aria-expanded="false">
              <span class="meta-key" data-i18n="swap.detailsLabel">更多设置</span>
              <span class="flex items-center gap-1">
                <span id="swap-details-summary" class="meta-summary" data-i18n="swap.detailsDefaultSummary">滑点 1%</span>
                <span class="meta-chevron">▾</span>
              </span>
            </button>
            <div id="swap-details-body" class="meta-details-body hidden">
              <div class="meta-row">
                <span class="meta-key" data-i18n="swap.routeLabel">执行路由</span>
                <span id="swap-quote-route" class="meta-val">--</span>
              </div>
              <div class="meta-row">
                <span class="meta-key" data-i18n="swap.feeLabel">服务费</span>
                <span id="swap-quote-fee" class="meta-val">--</span>
              </div>
              <div class="meta-row">
                <span class="meta-key" data-i18n="swap.slippageLabel">滑点容差</span>
                <div class="flex gap-1">
                  <button type="button" class="filter-pill" data-bps="50" onclick="setSwapSlippage(50)">0.5%</button>
                  <button type="button" class="filter-pill active" data-bps="100" onclick="setSwapSlippage(100)">1%</button>
                  <button type="button" class="filter-pill" data-bps="300" onclick="setSwapSlippage(300)">3%</button>
                </div>
              </div>
              <div id="swap-gas-reserve-row" class="meta-row hidden">
                <span id="swap-gas-reserve-label" class="meta-key" data-i18n="swap.gasReserveLabel">目标链 Gas 预留</span>
                <div class="flex gap-1 items-center">
                  <button type="button" class="filter-pill active" data-gas-mode="auto" onclick="setSwapGasReserveMode('auto')" data-i18n="swap.gasModeAuto">默认</button>
                  <button type="button" class="filter-pill" data-gas-mode="extra" onclick="setSwapGasReserveMode('extra')" data-i18n="swap.gasModeExtra">多留</button>
                </div>
              </div>
            </div>
          </div>

          <div id="swap-price-impact-banner" class="swap-impact-banner hidden" role="alert"></div>

          <div id="swap-gas-fix-banner" class="gas-fix-banner hidden">
            <span id="swap-gas-fix-text" class="gas-fix-text"></span>
            <button type="button" id="btn-swap-gas-fix" class="mini-action-btn primary" onclick="applySwapMaxSpendableFix()" data-i18n="swap.useMaxBtn">设为最大可用</button>
          </div>

          <div id="swap-error-banner" class="swap-error-banner hidden"></div>

          <button type="button" id="btn-execute-swap" class="btn-primary" onclick="executeActiveSwap()" data-i18n="swap.executeBtn">确认闪兑</button>
        </div>

        <!-- Active 1Click Order Status Card -->
        <div id="swap-order-card" class="ios-glass-card hidden flex flex-col gap-3">
          <div class="flex items-center justify-between">
            <span style="font-weight: 700; font-size: 14px;" data-i18n="swap.orderTitle">跨链订单跟踪</span>
            <button type="button" class="btn-ghost-sm" onclick="clearActiveSwapOrder()" data-i18n="swap.orderDoneBtn">完成</button>
          </div>
          <div class="meta-list">
            <div class="meta-row">
              <span class="meta-key" data-i18n="swap.orderStatus">订单状态</span>
              <span id="swap-order-status" class="meta-val">--</span>
            </div>
            <div id="swap-order-tx-row" class="meta-row hidden">
              <span class="meta-key" data-i18n="swap.orderTxHash">交易哈希</span>
              <span id="swap-order-origin-tx" class="meta-val mono" style="font-size: 11px;">--</span>
            </div>
          </div>
          <div id="swap-order-manual-box" class="flex flex-col gap-3">
            <div id="swap-order-qr" class="qr-frame hidden"></div>
            <div class="meta-list">
              <div class="meta-row">
                <span class="meta-key" data-i18n="swap.orderDepositAddr">充值地址</span>
                <button type="button" class="btn-ghost-sm" onclick="copySwapOrderDeposit()" data-i18n="common.copy">复制</button>
              </div>
              <div id="swap-order-deposit-addr" class="mono" style="font-size: 11px; word-break: break-all; color: var(--near-emerald);">--</div>
            </div>
            <div class="flex gap-2">
              <input id="swap-order-txhash-input" type="text" class="input-field mono flex-1" data-i18n-placeholder="swap.orderSubmitHashPlaceholder" placeholder="粘贴外部转账交易哈希加速确认" />
              <button type="button" id="btn-submit-swap-order-txhash" class="btn-secondary" onclick="submitSwapOrderTxHash()" data-i18n="swap.orderSubmitHashBtn">提交凭证</button>
            </div>
          </div>
          <button type="button" id="btn-resume-swap-stage" class="btn-primary hidden" onclick="resumeActiveSwapFollowUp()" data-i18n="swap.orderResumeBtn">继续执行下一步</button>
          <button type="button" id="btn-refresh-swap-order" class="btn-secondary" onclick="refreshActiveSwapOrderStatus(true)" data-i18n="swap.orderRefresh">刷新状态</button>
        </div>

        <!-- Swap History Card -->
        <div class="ios-glass-card flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <span style="font-weight: 700; font-size: 14px;" data-i18n="swap.historyTitle">闪兑记录</span>
          </div>
          <div id="swap-history-list" class="flex flex-col gap-2"></div>
        </div>
        </div>

        <!-- Limit Orders Panel -->
        <div id="swap-limit-panel" class="hidden flex flex-col gap-3">
          <div id="limit-chain-pills" class="pill-scroll">
            <button type="button" class="filter-pill active" data-limit-chain="near" onclick="setLimitChain('near')">NEAR</button>
            <button type="button" class="filter-pill" data-limit-chain="sol" onclick="setLimitChain('sol')">Solana</button>
            <button type="button" class="filter-pill" data-limit-chain="eth" onclick="setLimitChain('eth')">ETH</button>
            <button type="button" class="filter-pill" data-limit-chain="base" onclick="setLimitChain('base')">Base</button>
            <button type="button" class="filter-pill" data-limit-chain="arb" onclick="setLimitChain('arb')">Arbitrum</button>
            <button type="button" class="filter-pill" data-limit-chain="bsc" onclick="setLimitChain('bsc')">BSC</button>
            <button type="button" class="filter-pill" data-limit-chain="pol" onclick="setLimitChain('pol')">Polygon</button>
            <button type="button" class="filter-pill" data-limit-chain="avax" onclick="setLimitChain('avax')">Avalanche</button>
          </div>

          <div class="ios-glass-card flex flex-col gap-3">
            <!-- Limit Sell Box -->
            <div class="swap-box">
              <div class="swap-box-top">
                <span data-i18n="limit.sellLabel">卖出</span>
                <div class="flex items-center gap-2">
                  <span><span data-i18n="swap.balanceLabel">可用</span>: <span id="limit-sell-balance" class="mono">--</span></span>
                  <button type="button" id="btn-limit-wrap" class="mini-action-btn hidden" onclick="wrapNativeForLimitUI()" data-i18n="limit.wrapBtn">封装</button>
                  <button type="button" class="mini-action-btn primary" onclick="setLimitMaxAmount()" data-i18n="swap.maxBtn">全部</button>
                </div>
              </div>
              <div class="swap-box-main">
                <button type="button" id="limit-sell-token-btn" class="token-select-btn" onclick="openLimitTokenPicker('from')"></button>
                <input id="limit-amount-in" type="number" step="any" min="0" class="amount-input-lg" placeholder="0.00" oninput="handleLimitInput()" />
              </div>
              <div class="swap-box-top">
                <span id="limit-sell-net-label">--</span>
                <span id="limit-usd-in">--</span>
              </div>
            </div>

            <!-- Limit Flip Button -->
            <div class="swap-flip-wrap">
              <button type="button" class="swap-flip-btn" onclick="flipLimitTokens()" aria-label="Flip">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
              </button>
            </div>

            <!-- Limit Buy Box -->
            <div class="swap-box">
              <div class="swap-box-top">
                <span data-i18n="limit.buyLabel">买入</span>
                <span><span data-i18n="swap.balanceLabel">可用</span>: <span id="limit-buy-balance" class="mono">--</span></span>
              </div>
              <div class="swap-box-main">
                <button type="button" id="limit-buy-token-btn" class="token-select-btn" onclick="openLimitTokenPicker('to')"></button>
                <input id="limit-amount-out" type="text" readonly class="amount-input-lg" placeholder="--" />
              </div>
              <div class="swap-box-top">
                <span id="limit-buy-net-label">--</span>
                <span id="limit-usd-out">--</span>
              </div>
            </div>

            <!-- Target Price Box -->
            <div class="swap-box">
              <div class="swap-box-top">
                <span data-i18n="limit.priceLabel">目标价格</span>
                <span class="flex items-center gap-1">
                  <span><span data-i18n="limit.marketRefLabel">当前参考</span>: <span id="limit-market-rate" class="mono">--</span></span>
                  <button type="button" id="limit-rate-flip-btn" class="btn-ghost-sm" style="padding: 1px 6px; font-size: 11px;" onclick="toggleLimitPriceOrientation()" aria-label="Flip price orientation">⇄</button>
                </span>
              </div>
              <div class="swap-box-main" style="gap: 8px;">
                <span id="limit-rate-prefix" style="font-size: 12px; color: var(--text-secondary); white-space: nowrap;">1 -- =</span>
                <input id="limit-target-rate" type="number" step="any" min="0" class="amount-input-lg" placeholder="0.00" oninput="handleLimitRateInput()" />
                <span id="limit-rate-suffix" style="font-size: 12px; font-weight: 700; color: var(--near-emerald); white-space: nowrap;">--</span>
              </div>
              <div id="limit-target-usd-hint" class="mono" style="font-size: 11px; color: var(--text-muted); text-align: right; min-height: 14px;"></div>
              <div id="limit-offset-pills" class="flex gap-1">
                <button type="button" class="filter-pill" data-offset-idx="0" onclick="applyLimitRateOffsetByIndex(0)" data-i18n="limit.rateOffsetNow">现价</button>
                <button type="button" class="filter-pill" data-offset-idx="1" onclick="applyLimitRateOffsetByIndex(1)">+2%</button>
                <button type="button" class="filter-pill" data-offset-idx="2" onclick="applyLimitRateOffsetByIndex(2)">+5%</button>
                <button type="button" class="filter-pill" data-offset-idx="3" onclick="applyLimitRateOffsetByIndex(3)">+10%</button>
              </div>
              <div id="limit-near-tick-controls" class="limit-dcl-tick-bar hidden">
                <div class="flex items-center justify-between gap-2">
                  <span style="font-size: 11px; color: var(--text-muted);" data-i18n="limit.activeTickLabel">链上生效档位</span>
                  <span id="limit-snapped-tick-label" class="mono text-emerald" style="font-size: 12px; font-weight: 700;">--</span>
                </div>
                <div class="flex gap-2">
                  <button type="button" class="mini-action-btn flex-1" onclick="stepLimitDclPoint(-1)" data-i18n="limit.stepDown">− 低一档</button>
                  <button type="button" class="mini-action-btn flex-1" onclick="stepLimitDclPoint(1)" data-i18n="limit.stepUp">高一档 +</button>
                </div>
              </div>
            </div>

            <div id="limit-price-warning-banner" class="swap-impact-banner hidden" role="alert"></div>

            <!-- NEAR Split-2-Ticks Option -->
            <div id="limit-split-row" class="flex flex-col gap-2 hidden">
              <div class="meta-row" style="padding: 2px 2px;">
                <span class="meta-key" data-i18n="limit.splitTicksLabel">拆成相邻两档 (更易吃单)</span>
                <label class="nexus-switch">
                  <input id="limit-split-toggle" type="checkbox" onchange="toggleLimitSplitTicks(this.checked)" />
                  <span class="nexus-switch-slider"></span>
                </label>
              </div>
              <div id="limit-split-preview" class="limit-split-preview hidden"></div>
            </div>

            <!-- Solana / EVM Expiry Row -->
            <div id="limit-expiry-row" class="meta-row hidden">
              <span class="meta-key" data-i18n="limit.expiryLabel">有效期</span>
              <div id="limit-expiry-pills" class="flex gap-1">
                <button type="button" class="filter-pill" data-exp-days="1" onclick="setLimitExpiryDays(1)" data-i18n="limit.exp1d">1天</button>
                <button type="button" class="filter-pill active" data-exp-days="7" onclick="setLimitExpiryDays(7)" data-i18n="limit.exp7d">7天</button>
                <button type="button" class="filter-pill" data-exp-days="30" onclick="setLimitExpiryDays(30)" data-i18n="limit.exp30d">30天</button>
              </div>
            </div>

            <!-- Limit Meta Summary -->
            <div class="meta-list">
              <div class="meta-row">
                <span class="meta-key" data-i18n="limit.estReceive">预计获得</span>
                <span id="limit-meta-est-out" class="meta-val">--</span>
              </div>
              <div id="limit-meta-fee-row" class="meta-row hidden">
                <span class="meta-key" data-i18n="limit.poolFeeLabel">池子费率</span>
                <span id="limit-meta-pool-fee" class="meta-val">--</span>
              </div>
              <div class="meta-row">
                <span class="meta-key" data-i18n="limit.gasLabel">网络费 (Gas)</span>
                <span id="limit-meta-gas" class="meta-val">--</span>
              </div>
              <div class="meta-row">
                <span class="meta-key" data-i18n="limit.depositLabel">押金 (可退)</span>
                <span id="limit-meta-deposit" class="meta-val">--</span>
              </div>
              <div class="meta-row">
                <span class="meta-key" data-i18n="limit.minOrderLabel">最低限额</span>
                <span id="limit-meta-min" class="meta-val">--</span>
              </div>
            </div>

            <div id="limit-error-banner" class="swap-error-banner hidden"></div>
            <button type="button" id="btn-execute-limit" class="btn-primary" onclick="executeLimitOrderAction()" data-i18n="limit.submitBtn">提交限价单</button>
          </div>

          <!-- Active / History Limit Orders -->
          <div id="limit-orders-card" class="ios-glass-card flex flex-col gap-3">
            <div class="flex items-center justify-between gap-2">
              <span style="font-weight: 700; font-size: 14px;" data-i18n="limit.ordersTitle">限价挂单</span>
              <div class="flex items-center gap-2">
                <div class="flex gap-1">
                  <button type="button" id="limit-tab-active" class="filter-pill active" onclick="setLimitOrdersTab('active')" data-i18n="limit.tabActive">当前挂单</button>
                  <button type="button" id="limit-tab-history" class="filter-pill" onclick="setLimitOrdersTab('history')" data-i18n="limit.tabHistory">历史挂单</button>
                </div>
                <button type="button" id="btn-refresh-limit-orders" class="btn-ghost-sm" onclick="refreshLimitOrdersAsync(true)" data-i18n="common.refresh">刷新</button>
              </div>
            </div>
            <div id="limit-orders-list" class="flex flex-col gap-2"></div>
          </div>
        </div>
      </section>
