<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#06080F" />
  <title>Nexus Wallet — NEAR Chain Abstraction</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png?v=6.94" />
  <link rel="apple-touch-icon" sizes="192x192" href="assets/nexus-logo-192.png?v=6.94" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css?v=6.94" />
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('near_ca_wallets_v1') || localStorage.getItem('pearl_user_wallets_v4');
        if (!raw) return;
        var parsed = JSON.parse(raw);
        var list = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.wallets) ? parsed.wallets : []);
        if (list.length === 0) return;
        var cap = window.Capacitor;
        var isNative = Boolean(
          (typeof location !== 'undefined' && location.protocol === 'capacitor:') ||
          (cap && ((cap.Plugins && cap.Plugins.NativeSecurity) || (typeof cap.isNativePlatform === 'function' && cap.isNativePlatform())))
        );
        var hasSec = list.some(function (w) { return Boolean(w && (w.webauthnCredentialId)); });
        if (isNative || hasSec) {
          document.documentElement.classList.add('nexus-locked');
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div id="app-root"></div>
