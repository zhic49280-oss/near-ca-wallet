  <!-- ==================== Sheet Backdrop ==================== -->
  <div id="sheet-backdrop" class="sheet-backdrop" onclick="closeAllSheets()"></div>

  <!-- ==================== Sheet: Unified Send ==================== -->
  <div id="sheet-send" class="bottom-sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 class="sheet-title" data-i18n="sheet.sendTitle">统一跨链转账</h3>
      <button type="button" class="btn-ghost-sm" onclick="closeAllSheets()" data-i18n="common.close">关闭</button>
    </div>
    <div class="sheet-body">
      <div class="flex flex-col gap-1">
        <span style="font-size: 12px; color: var(--text-secondary);" data-i18n="sheet.sendAssetLabel">选择资产</span>
        <select id="send-asset-select" class="input-field" onchange="handleSendAssetChange()"></select>
      </div>

      <div class="flex flex-col gap-1">
        <span style="font-size: 12px; color: var(--text-secondary);" data-i18n="sheet.sendSourceLabel">扣除来源</span>
        <select id="send-source-select" class="input-field" onchange="updateSendAvailabilityUI()"></select>
      </div>

      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <span style="font-size: 12px; color: var(--text-secondary);" data-i18n="sheet.sendToLabel">收款地址（自动识别链类型）</span>
          <div class="flex gap-1">
            <button type="button" class="btn-ghost-sm" onclick="openQrScannerSheet('send')" data-i18n="common.scan">扫码</button>
            <button type="button" class="btn-ghost-sm" onclick="pasteToSendAddress()" data-i18n="common.paste">粘贴</button>
            <button type="button" class="btn-ghost-sm" onclick="openContactsPicker('send')" data-i18n="common.contacts">地址簿</button>
          </div>
        </div>
        <input id="send-recipient-input" type="text" class="input-field mono" data-i18n-placeholder="sheet.sendToPlaceholder" placeholder="输入 .near / 0x / Solana / prl1p / bc1 地址" oninput="handleSendRecipientInput()" />
        <div id="send-detected-net" style="font-size: 11px; color: var(--cyan-glow);"></div>
        <div id="send-evm-chain-row" class="flex flex-col gap-1 hidden" style="margin-top: 4px;">
          <span style="font-size: 11.5px; color: var(--text-secondary);" data-i18n="sheet.sendEvmChainLabel">目标 EVM 网络</span>
          <div id="send-evm-chain-pills" class="pill-scroll"></div>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <span style="font-size: 12px; color: var(--text-secondary);" data-i18n="sheet.sendAmountLabel">转账数量</span>
          <div class="flex items-center gap-2">
            <span style="font-size: 11.5px; color: var(--text-secondary);">
              <span data-i18n="swap.balanceLabel">可用</span>: <span id="send-available-bal" class="mono">--</span>
            </span>
            <button type="button" id="btn-send-max" class="mini-action-btn primary" onclick="setSendMaxAmount()" data-i18n="swap.maxBtn">全部</button>
          </div>
        </div>
        <input id="send-amount-input" type="number" step="any" min="0" class="input-field mono" placeholder="0.00" oninput="handleSendAmountInput()" />
        <div id="send-gas-fix-banner" class="gas-fix-banner hidden">
          <span id="send-gas-fix-text" class="gas-fix-text"></span>
          <button type="button" id="btn-send-gas-fix" class="mini-action-btn primary" onclick="applySendMaxSpendableFix()" data-i18n="swap.useMaxBtn">设为最大可用</button>
        </div>
      </div>

      <div id="send-route-preview" class="meta-list hidden"></div>
      <button type="button" id="btn-confirm-send" class="btn-primary" onclick="executeUnifiedSend()" data-i18n="sheet.sendConfirmBtn">确认发送</button>
    </div>
  </div>

  <!-- ==================== Sheet: Unified Receive ==================== -->
  <div id="sheet-receive" class="bottom-sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 class="sheet-title" data-i18n="sheet.receiveTitle">多链统一收款</h3>
      <button type="button" class="btn-ghost-sm" onclick="closeAllSheets()" data-i18n="common.close">关闭</button>
    </div>
    <div class="sheet-body" style="text-align: center;">
      <div id="receive-network-pills" class="pill-scroll"></div>
      <div id="receive-qr-container" class="qr-frame"></div>
      <div id="receive-addr-label" style="font-size: 12px; font-weight: 700; color: var(--text-secondary);">--</div>
      <div id="receive-addr-value" class="input-field mono" style="word-break: break-all; font-size: 11.5px; text-align: center;">--</div>
      <button type="button" class="btn-primary" onclick="copyReceiveAddress()" data-i18n="sheet.receiveCopyBtn">复制收款地址</button>
    </div>
  </div>

  <!-- ==================== Sheet: OKX-Style Token Detail & Activity ==================== -->
  <div id="sheet-token-detail" class="bottom-sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="flex items-center gap-2">
        <div id="token-detail-icon"></div>
        <h3 id="token-detail-title" class="sheet-title">--</h3>
      </div>
      <button type="button" class="btn-ghost-sm" onclick="closeAllSheets()" data-i18n="common.close">关闭</button>
    </div>
    <div class="sheet-body flex flex-col gap-3" style="max-height: 78vh; overflow-y: auto;">
      <div id="token-detail-chains" class="pill-scroll"></div>
      <div class="ios-glass-card flex flex-col gap-3">
        <div class="flex items-baseline justify-between">
          <span id="token-detail-balance" class="mono" style="font-size: 26px; font-weight: 800; color: #fff;">0</span>
          <span id="token-detail-usd" class="mono" style="font-size: 13.5px; color: var(--text-secondary);">--</span>
        </div>
        <div class="quick-actions-grid" style="grid-template-columns: repeat(4, 1fr); gap: 8px;">
          <button type="button" class="action-pill" onclick="tokenDetailAction('send')">
            <span class="action-icon">↑</span>
            <span data-i18n="home.sendBtn">转账</span>
          </button>
          <button type="button" class="action-pill" onclick="tokenDetailAction('receive')">
            <span class="action-icon">↓</span>
            <span data-i18n="home.receiveBtn">收款</span>
          </button>
          <button type="button" class="action-pill" onclick="tokenDetailAction('swap')">
            <span class="action-icon">⇄</span>
            <span data-i18n="home.swapBtn">闪兑</span>
          </button>
          <button type="button" class="action-pill" onclick="tokenDetailAction('bridge')">
            <span class="action-icon">⛓</span>
            <span data-i18n="detail.bridgeBtn">跨链桥</span>
          </button>
        </div>
        <div id="token-detail-addr-row" class="meta-row hidden" style="padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.06);">
          <div class="flex flex-col" style="min-width: 0; flex: 1;">
            <span class="meta-key" data-i18n="detail.receiveAddrLabel">当前网络收款地址</span>
            <span id="token-detail-addr" class="mono" style="font-size: 11.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">--</span>
          </div>
          <button type="button" class="mini-action-btn" onclick="copyTokenDetailAddress()" data-i18n="common.copy">复制</button>
        </div>
      </div>

      <!-- Per-Chain Breakdown when 'all' is selected -->
      <div id="token-detail-breakdown-card" class="ios-glass-card flex flex-col gap-2">
        <span style="font-weight: 700; font-size: 13px;" data-i18n="detail.chainBreakdownTitle">分链余额明细</span>
        <div id="token-detail-breakdown-list" class="flex flex-col gap-2"></div>
      </div>

      <!-- Earn / Staking / Lending Section for this token -->
      <div id="token-detail-earn-card" class="hidden flex flex-col gap-3">
        <div id="token-detail-earn-list" class="flex flex-col gap-3"></div>
      </div>

      <!-- On-Chain Activity & Transaction History -->
      <div class="ios-glass-card flex flex-col gap-2">
        <div class="flex items-center justify-between gap-2">
          <span style="font-weight: 700; font-size: 13px;" data-i18n="detail.historyTitle">最近交易</span>
          <div class="flex items-center gap-2">
            <button type="button" id="token-detail-history-all-btn" class="btn-ghost-sm hidden" onclick="openAllTokenHistorySheet()" data-i18n="detail.allBtn">全部 ›</button>
            <a id="token-detail-explorer-link" href="#" target="_blank" rel="noopener noreferrer" class="mono" style="font-size: 11.5px; color: var(--near-emerald); text-decoration: none;" data-i18n="detail.openExplorerBtn">前往浏览器 ↗</a>
          </div>
        </div>
        <div id="token-detail-history-list" class="flex flex-col gap-2" style="font-size: 12px;"></div>
      </div>

      <!-- Bottom Live Price Bar -->
      <div class="ios-glass-card flex items-center justify-between" style="padding: 10px 14px;">
        <span id="token-detail-price-label" style="font-size: 12.5px; color: var(--text-secondary);">--</span>
        <span id="token-detail-price-val" class="mono text-emerald" style="font-weight: 700; font-size: 14px;">--</span>
      </div>
    </div>
  </div>

  <!-- ==================== Sheet: Token Picker ==================== -->
  <div id="sheet-token-picker" class="bottom-sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 class="sheet-title" data-i18n="sheet.tokenPickerTitle">选择代币</h3>
      <button type="button" class="btn-ghost-sm" onclick="closeAllSheets()" data-i18n="common.close">关闭</button>
    </div>
    <div class="sheet-body">
      <input id="token-picker-search" type="text" class="input-field" data-i18n-placeholder="sheet.tokenPickerSearch" placeholder="搜索币种名称或合约" oninput="renderTokenPickerList()" />
      <div id="token-picker-favorites" class="pill-scroll"></div>
      <div id="token-picker-chains" class="pill-scroll"></div>
      <div id="token-picker-more-chains" class="picker-more-chains-grid hidden"></div>
      <div id="token-picker-list" class="flex flex-col gap-2" style="max-height: 46vh; overflow-y: auto;"></div>
    </div>
  </div>
