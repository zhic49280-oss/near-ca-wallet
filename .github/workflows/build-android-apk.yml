name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install build dependencies
        run: npm ci

      - name: Build assets and run tests
        run: |
          npm run build
          npm test

      - name: Generate Capacitor Android project with custom NativeSecurityPlugin
        run: |
          mkdir -p /tmp/android-custom
          cp android/app/src/main/AndroidManifest.xml /tmp/android-custom/AndroidManifest.xml
          cp android/app/src/main/java/io/nexus/wallet/MainActivity.java /tmp/android-custom/MainActivity.java
          cp android/app/src/main/java/io/nexus/wallet/NativeSecurityPlugin.java /tmp/android-custom/NativeSecurityPlugin.java
          cp android/app/src/main/java/io/nexus/wallet/NativeDAppBrowserPlugin.java /tmp/android-custom/NativeDAppBrowserPlugin.java

          rm -rf android
          npm install --no-save @capacitor/core@^6.1.0 @capacitor/cli@^6.1.0 @capacitor/android@^6.1.0
          npx cap add android

          mkdir -p android/app/src/main/java/io/nexus/wallet
          cp /tmp/android-custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/android-custom/MainActivity.java android/app/src/main/java/io/nexus/wallet/MainActivity.java
          cp /tmp/android-custom/NativeSecurityPlugin.java android/app/src/main/java/io/nexus/wallet/NativeSecurityPlugin.java
          cp /tmp/android-custom/NativeDAppBrowserPlugin.java android/app/src/main/java/io/nexus/wallet/NativeDAppBrowserPlugin.java
          for f in android/app/src/main/res/mipmap-*/ic_launcher*.png; do
            if [ -f "$f" ]; then cp assets/nexus-logo-512.png "$f"; fi
          done

          npx cap sync android

      - name: Build & sign Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../build
          cp app/build/outputs/apk/debug/app-debug.apk ../build/NEAR-CA-Wallet.apk
          ls -lh ../build/NEAR-CA-Wallet.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEAR-CA-Wallet-android-apk
          path: build/NEAR-CA-Wallet.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="2.7.${GITHUB_RUN_NUMBER}"
          TAG="v${VER}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" build/NEAR-CA-Wallet.apk --clobber
          else
            gh release create "${TAG}" build/NEAR-CA-Wallet.apk \
              --title "NEAR CA Wallet ${TAG}" \
              --notes "Automated Android APK & iOS IPA release (${TAG})" \
              --latest || true
          fi
