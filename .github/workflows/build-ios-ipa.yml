name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build assets and run tests
        run: |
          npm run build
          npm test

      - name: Generate Capacitor iOS project with custom NativeSecurityPlugin
        run: |
          mkdir -p /tmp/ios-custom
          cp ios/App/App/Info.plist /tmp/ios-custom/Info.plist
          cp ios/App/App/NativeSecurityPlugin.swift /tmp/ios-custom/NativeSecurityPlugin.swift
          cp ios/App/App/NativeDAppBrowserPlugin.swift /tmp/ios-custom/NativeDAppBrowserPlugin.swift
          cp ios/App/App/MainViewController.swift /tmp/ios-custom/MainViewController.swift

          rm -rf ios
          npm install --no-save @capacitor/core@^6.1.0 @capacitor/cli@^6.1.0 @capacitor/ios@^6.1.0
          npx cap add ios

          cp /tmp/ios-custom/Info.plist ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 2.7.${GITHUB_RUN_NUMBER}" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" ios/App/App/Info.plist
          cp /tmp/ios-custom/NativeSecurityPlugin.swift ios/App/App/NativeSecurityPlugin.swift
          cp /tmp/ios-custom/NativeDAppBrowserPlugin.swift ios/App/App/NativeDAppBrowserPlugin.swift
          cp /tmp/ios-custom/MainViewController.swift ios/App/App/MainViewController.swift
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="MainViewController" customModule="App"/' ios/App/App/Base.lproj/Main.storyboard
          grep -n MainViewController ios/App/App/Base.lproj/Main.storyboard

          ruby -e '
            require "xcodeproj"
            proj_path = "ios/App/App.xcodeproj"
            project = Xcodeproj::Project.open(proj_path)
            target = project.targets.find { |t| t.name == "App" }
            app_group = project.main_group.find_subpath("App/App", false) || project.main_group.find_subpath("App", false)
            ["NativeSecurityPlugin.swift", "NativeDAppBrowserPlugin.swift", "MainViewController.swift"].each do |fname|
              file_ref = app_group.files.find { |f| f.path == fname } || app_group.new_file(fname)
              unless target.source_build_phase.files_references.include?(file_ref)
                target.source_build_phase.add_file_reference(file_ref)
              end
            end
            project.save
          '

          if [ -d "ios/App/App/Assets.xcassets/AppIcon.appiconset" ]; then
            sips -z 1024 1024 assets/nexus-logo-512.png --out /tmp/nexus-1024.png >/dev/null
            for f in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do
              if [ -f "$f" ]; then cp /tmp/nexus-1024.png "$f"; fi
            done
            if [ ! -f "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png" ]; then
              cp /tmp/nexus-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
            fi
          fi

          npx cap sync ios

      - name: Build unsigned xcarchive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../NEAR-CA-Wallet-unsigned.ipa Payload
          ls -lh ../NEAR-CA-Wallet-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEAR-CA-Wallet-unsigned-ipa
          path: build/NEAR-CA-Wallet-unsigned.ipa
          retention-days: 30

      - name: Generate SideStore / AltStore source JSON & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA_SIZE=$(stat -f%z build/NEAR-CA-Wallet-unsigned.ipa)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VER="2.7.${GITHUB_RUN_NUMBER}"
          TAG="v${VER}"
          IPA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/NEAR-CA-Wallet-unsigned.ipa"
          cat > sidestore-source.json <<EOF
          {
            "name": "Nexus Wallet Official Source",
            "identifier": "io.near.cawallet.source",
            "subtitle": "Self-Custody Chain Abstraction Wallet",
            "description": "Official SideStore / AltStore auto-update repository for Nexus Wallet.",
            "iconURL": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/nexus-logo-512.png",
            "website": "https://github.com/${GITHUB_REPOSITORY}",
            "tintColor": "#10B981",
            "featuredApps": ["io.nexus.wallet"],
            "apps": [
              {
                "name": "Nexus Wallet",
                "bundleIdentifier": "io.nexus.wallet",
                "developerName": "Nexus Wallet",
                "subtitle": "Chain Abstraction Self-Custody Wallet",
                "localizedDescription": "NEAR Account-Centric Chain Abstraction Self-Custody Wallet",
                "iconURL": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/nexus-logo-512.png",
                "tintColor": "#10B981",
                "category": "utilities",
                "version": "${VER}",
                "versionDate": "${BUILD_DATE}",
                "versionDescription": "Auto-built from commit ${GITHUB_SHA::7}",
                "downloadURL": "${IPA_URL}",
                "size": ${IPA_SIZE},
                "versions": [
                  {
                    "version": "${VER}",
                    "date": "${BUILD_DATE}",
                    "localizedDescription": "Auto-built from commit ${GITHUB_SHA::7}",
                    "downloadURL": "${IPA_URL}",
                    "size": ${IPA_SIZE},
                    "minOSVersion": "14.0"
                  }
                ],
                "appPermissions": {
                  "entitlements": [],
                  "privacy": {
                    "NSFaceIDUsageDescription": "Verify identity for transaction signing and recovery phrase access."
                  }
                }
              }
            ],
            "news": []
          }
          EOF
          cp sidestore-source.json build/sidestore-source.json
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" build/NEAR-CA-Wallet-unsigned.ipa build/sidestore-source.json --clobber
          else
            gh release create "${TAG}" build/NEAR-CA-Wallet-unsigned.ipa build/sidestore-source.json \
              --title "NEAR CA Wallet ${TAG}" \
              --notes "Automated iOS IPA, Android APK & SideStore source release (${TAG})" \
              --latest || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sidestore-source.json
          git diff --cached --quiet || (git commit -m "chore(ios): update SideStore source to ${TAG} [skip ci]" && git pull --rebase --autostash origin main && git push)
